<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSF Admin</title><link rel="stylesheet" href="css/style.css"></head>
<body class="admin-page"><header class="site-header"><a class="brand" href="index.html">JSF FASHION WEAR / ADMIN</a><a href="index.html">View Store ↗</a></header>
<main class="admin-wrap"><h1>Store Admin</h1><section id="loginPanel" class="panel"><h2>Admin Login</h2><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">Sign in</button></form><p class="hint">Firebase Authentication-এ আগে admin email/password user তৈরি করুন।</p></section>
<section id="dashboard" hidden>
<div class="panel"><div class="section-heading"><h2>Store Logo</h2><span class="hint">আপনার লোগো পরে আপলোড করুন</span></div><input id="logoFile" type="file" accept="image/*"><img id="logoPreview" class="logo-preview" alt="Logo preview" hidden><button id="saveLogo" class="secondary">Save logo on this browser</button></div>
<div class="panel"><h2>Add / Edit Product</h2><form id="productForm"><input id="productId" type="hidden"><div class="form-grid"><label>Product name<input id="name" required></label><label>Price (৳)<input id="price" type="number" min="0" required></label><label>Category<input id="category" placeholder="T-Shirt"></label><label>Sizes<input id="sizes" placeholder="S, M, L, XL"></label></div><label>Description<textarea id="description" rows="3"></textarea></label><label>Product image<input id="imageFile" type="file" accept="image/*"></label><button class="primary" type="submit">Save product</button><button id="resetForm" class="secondary" type="button">Clear</button><p id="formStatus" class="hint"></p></form></div>
<div class="panel"><div class="section-heading"><h2>Products</h2><button id="logout" class="secondary">Sign out</button></div><div id="adminProducts"></div></div>
</section></main><script type="module" src="js/admin.js"></script></body></html>
